<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#a855f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kill Switch">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bulledger Kill Switch</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0f;
    --card:      #12121a;
    --border:    #1e1e2e;
    --purple:    #a855f7;
    --gold:      #f59e0b;
    --green:     #22c55e;
    --red:       #ef4444;
    --gray:      #555;
    --text:      #ccc;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 16px);
    min-height: 100%;
    overflow-y: auto;
  }

  /* ── Install banner ── */
  #installBanner {
    display: none;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(135deg, #1a0a2e, #12121a);
    border: 1px solid var(--purple);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 16px;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  #installBanner.show { display: flex; }
  #installBanner .ib-icon { font-size: 28px; flex-shrink: 0; }
  #installBanner .ib-text { flex: 1; }
  #installBanner .ib-title { font-size: 13px; font-weight: 700; color: var(--purple); }
  #installBanner .ib-sub   { font-size: 11px; color: #888; margin-top: 2px; }
  #installBanner .ib-btn {
    background: var(--purple); color: #fff; border: none;
    padding: 8px 14px; border-radius: 8px; font-size: 12px;
    font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  #installBanner .ib-close {
    background: none; border: none; color: #444;
    font-size: 18px; cursor: pointer; flex-shrink: 0; padding: 0 4px;
  }

  /* ── Header ── */
  .header { text-align: center; margin: 8px 0 20px; }
  .header h1 { font-size: 20px; font-weight: 900; color: var(--purple); letter-spacing: 2px; text-transform: uppercase; }
  .header p  { font-size: 11px; color: #444; margin-top: 3px; letter-spacing: 1px; text-transform: uppercase; }

  /* ── Card ── */
  .card {
    background: var(--card);
    border: 1px solid #2a2a3a;
    border-radius: 20px;
    padding: 24px 20px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* ── Status pill ── */
  .status-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 22px; border-radius: 999px;
    font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    transition: all 0.35s; border: 1.5px solid transparent;
  }
  .status-pill.on      { background: rgba(34,197,94,.12); border-color: var(--green); color: var(--green); }
  .status-pill.off     { background: rgba(239,68,68,.12);  border-color: var(--red);   color: var(--red); }
  .status-pill.loading { background: rgba(245,158,11,.10); border-color: var(--gold);  color: var(--gold); }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.on      { background: var(--green); animation: pg 2s infinite; }
  .dot.off     { background: var(--red); }
  .dot.loading { background: var(--gold); animation: pa 1s infinite; }
  @keyframes pg { 0%,100%{box-shadow:0 0 5px var(--green)} 50%{box-shadow:0 0 14px var(--green)} }
  @keyframes pa { 0%,100%{opacity:1} 50%{opacity:.25} }

  /* ── Big button ── */
  .toggle-btn {
    width: 190px; height: 190px; border-radius: 50%;
    border: none; cursor: pointer;
    font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    transition: all 0.3s; position: relative; outline: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    user-select: none;
  }
  .toggle-btn.on  { background: radial-gradient(circle at 38% 33%, #16a34a, #052e16); box-shadow: 0 0 0 6px rgba(34,197,94,.15), 0 0 55px rgba(34,197,94,.2); color: #86efac; }
  .toggle-btn.off { background: radial-gradient(circle at 38% 33%, #b91c1c, #200000); box-shadow: 0 0 0 6px rgba(239,68,68,.15), 0 0 55px rgba(239,68,68,.2);   color: #fca5a5; }
  .toggle-btn.loading { background: radial-gradient(circle at 38% 33%, #78350f, #0f0700); box-shadow: 0 0 0 6px rgba(245,158,11,.10); color: #fde68a; cursor: not-allowed; }
  .toggle-btn:not(.loading):active { transform: scale(0.94); }
  .btn-ring { position: absolute; inset: -12px; border-radius: 50%; border: 1.5px solid transparent; pointer-events: none; transition: border-color .4s; }
  .toggle-btn.on  .btn-ring { border-color: rgba(34,197,94,.3); }
  .toggle-btn.off .btn-ring { border-color: rgba(239,68,68,.3); }
  .btn-icon  { font-size: 44px; display: block; margin-bottom: 6px; }
  .btn-label { display: block; font-size: 13px; }

  /* ── Note input ── */
  .note-section { width: 100%; }
  .note-section label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
  .note-input {
    width: 100%; background: #0e0e18; border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 14px;
    padding: 10px 13px; outline: none; transition: border-color .2s;
    -webkit-appearance: none;
  }
  .note-input:focus { border-color: var(--purple); }

  /* ── Info rows ── */
  .info-grid { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #0e0e18; border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 13px; font-size: 11px;
  }
  .info-row .lbl { color: #444; text-transform: uppercase; letter-spacing: .8px; }
  .info-row .val { color: var(--text); font-weight: 600; font-size: 11px; text-align: right; max-width: 60%; word-break: break-all; }

  /* ── Log ── */
  .log-section { width: 100%; }
  .log-section h3 { font-size: 10px; color: #333; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .log-box {
    background: #080810; border: 1px solid #161622; border-radius: 10px;
    padding: 10px; font-size: 10px; color: #444; font-family: monospace;
    max-height: 110px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px;
  }
  .log-entry { display: flex; gap: 6px; }
  .log-entry .ts { color: #2a2a3a; flex-shrink: 0; }
  .log-entry .msg.on   { color: var(--green); }
  .log-entry .msg.off  { color: var(--red); }
  .log-entry .msg.info { color: #444; }
  .log-entry .msg.err  { color: var(--gold); }

  /* ── Footer ── */
  .footer { margin-top: 20px; margin-bottom: 8px; font-size: 10px; color: #1e1e2e; text-align: center; letter-spacing: 1px; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    left: 50%; transform: translateX(-50%);
    background: #100820; border: 1px solid var(--purple); color: #d8b4fe;
    padding: 10px 18px; border-radius: 10px; font-size: 12px;
    opacity: 0; transition: opacity .3s; pointer-events: none;
    white-space: nowrap; z-index: 999; max-width: 90vw;
    text-align: center; white-space: normal;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Android install banner -->
<div id="installBanner">
  <span class="ib-icon">📲</span>
  <div class="ib-text">
    <div class="ib-title">Install as App</div>
    <div class="ib-sub">Add to home screen for quick access</div>
  </div>
  <button class="ib-btn" id="installBtn">Install</button>
  <button class="ib-close" id="dismissInstall">✕</button>
</div>

<div class="header">
  <img src="icon-192.png" alt="Bulledger" style="width:64px;height:64px;border-radius:12px;margin-bottom:8px;">
  <h1>BULLEDGER</h1>
  <p>Kill Switch — Remote EA Control</p>
</div>

<div class="card">

  <div class="status-pill loading" id="statusPill">
    <div class="dot loading" id="statusDot"></div>
    <span id="statusText">LOADING...</span>
  </div>

  <button class="toggle-btn loading" id="toggleBtn" onclick="handleToggle()">
    <div class="btn-ring"></div>
    <span class="btn-icon" id="btnIcon">⏳</span>
    <span class="btn-label" id="btnLabel">LOADING</span>
  </button>

  <div class="note-section">
    <label>Reason / Note (optional)</label>
    <input class="note-input" id="noteInput" type="text"
           placeholder="e.g. NFP news — pausing entries" maxlength="120"
           autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <div class="info-grid">
    <div class="info-row">
      <span class="lbl">Last changed</span>
      <span class="val" id="lastChanged">—</span>
    </div>
    <div class="info-row">
      <span class="lbl">Note on record</span>
      <span class="val" id="lastNote">—</span>
    </div>
    <div class="info-row">
      <span class="lbl">EA poll interval</span>
      <span class="val">~5 seconds</span>
    </div>
    <div class="info-row">
      <span class="lbl">Connection</span>
      <span class="val" id="connStatus" style="color:#555">Connecting...</span>
    </div>
  </div>

  <div class="log-section">
    <h3>Activity Log</h3>
    <div class="log-box" id="logBox">
      <div class="log-entry"><span class="ts">--:--:--</span><span class="msg info">Connecting to Supabase...</span></div>
    </div>
  </div>

</div>

<div class="footer">BULLEDGER PRO &nbsp;·&nbsp; www.bulledger.com</div>
<div class="toast" id="toast"></div>

<script>
// ─── Config ───────────────────────────────────────────
const SUPABASE_URL     = "https://wixbjyolwrrvvvhwkkyw.supabase.co";
const SUPABASE_API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpeGJqeW9sd3JydnZ2aHdra3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MDIyMjYsImV4cCI6MjA4NzQ3ODIyNn0.VsF9brbwNoXLVf_5MQgiIV_xJhGq5v8V-Afh6-t56DQ";
const TABLE            = "ea_control";
const HEADERS = {
  "apikey":        SUPABASE_API_KEY,
  "Authorization": "Bearer " + SUPABASE_API_KEY,
  "Content-Type":  "application/json",
  "Prefer":        "return=representation"
};

// ─── State ────────────────────────────────────────────
let currentState = null;
let isBusy = false;

// ─── Fetch current status ─────────────────────────────
async function fetchStatus() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.1&select=trading_enabled,updated_at,note`,
      { headers: HEADERS }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data.length) throw new Error("No row in ea_control");

    const row = data[0];
    currentState = row.trading_enabled;
    renderState(currentState);

    document.getElementById("lastChanged").textContent =
      row.updated_at ? new Date(row.updated_at).toLocaleString() : "—";
    document.getElementById("lastNote").textContent = row.note || "—";
    document.getElementById("connStatus").textContent  = "✓ Connected";
    document.getElementById("connStatus").style.color  = "#22c55e";

  } catch (e) {
    document.getElementById("connStatus").textContent = "⚠ " + e.message;
    document.getElementById("connStatus").style.color = "#f59e0b";
    log("Error: " + e.message, "err");
  }
}

// ─── Toggle ───────────────────────────────────────────
async function handleToggle() {
  if (isBusy || currentState === null) return;

  const newState   = !currentState;
  const noteVal    = document.getElementById("noteInput").value.trim() || null;
  const actionWord = newState ? "ENABLED" : "DISABLED";

  isBusy = true;
  setLoadingUI();

  try {
    const body = JSON.stringify({
      trading_enabled: newState,
      updated_at: new Date().toISOString(),
      note: noteVal
    });
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.1`, {
      method: "PATCH", headers: HEADERS, body
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    currentState = newState;
    renderState(currentState);

    document.getElementById("lastChanged").textContent = new Date().toLocaleString();
    document.getElementById("lastNote").textContent = noteVal || "—";
    document.getElementById("noteInput").value = "";

    log(`Trading ${actionWord}` + (noteVal ? ` — "${noteVal}"` : ""), newState ? "on" : "off");
    showToast(newState
      ? "✅ Trading ENABLED — all EAs activate within 5s"
      : "🛑 Trading DISABLED — all EAs stop within 5s"
    );

  } catch (e) {
    log("Update failed: " + e.message, "err");
    showToast("❌ Failed: " + e.message);
    renderState(currentState);
  }

  isBusy = false;
}

// ─── Render ───────────────────────────────────────────
function renderState(state) {
  const pill  = document.getElementById("statusPill");
  const dot   = document.getElementById("statusDot");
  const text  = document.getElementById("statusText");
  const btn   = document.getElementById("toggleBtn");
  const icon  = document.getElementById("btnIcon");
  const label = document.getElementById("btnLabel");

  const cls = state ? "on" : "off";
  pill.className  = "status-pill " + cls;
  dot.className   = "dot " + cls;
  text.textContent = state ? "TRADING ON" : "TRADING OFF";
  btn.className   = "toggle-btn " + cls;
  icon.textContent = state ? "✅" : "🛑";
  label.textContent = state ? "TAP TO DISABLE" : "TAP TO ENABLE";
}

function setLoadingUI() {
  ["statusPill","toggleBtn"].forEach(id => {
    document.getElementById(id).className = id.includes("Pill") ? "status-pill loading" : "toggle-btn loading";
  });
  document.getElementById("statusDot").className   = "dot loading";
  document.getElementById("statusText").textContent = "UPDATING...";
  document.getElementById("btnIcon").textContent   = "⏳";
  document.getElementById("btnLabel").textContent  = "PLEASE WAIT";
}

// ─── Log ──────────────────────────────────────────────
function log(msg, type = "info") {
  const box = document.getElementById("logBox");
  const now = new Date().toTimeString().slice(0,8);
  const el  = document.createElement("div");
  el.className = "log-entry";
  el.innerHTML = `<span class="ts">${now}</span><span class="msg ${type}">${msg}</span>`;
  box.insertBefore(el, box.firstChild);
  while (box.children.length > 40) box.removeChild(box.lastChild);
}

// ─── Toast ────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
}

// ─── PWA Install Prompt ───────────────────────────────
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").classList.add("show");
});

document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === "accepted") {
    log("App installed to home screen ✓", "info");
    showToast("✅ App installed! Find it on your home screen.");
  }
  deferredPrompt = null;
  document.getElementById("installBanner").classList.remove("show");
});

document.getElementById("dismissInstall").addEventListener("click", () => {
  document.getElementById("installBanner").classList.remove("show");
});

window.addEventListener('appinstalled', () => {
  document.getElementById("installBanner").classList.remove("show");
  log("App installed successfully", "info");
});

// ─── Service Worker ───────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ─── Boot ─────────────────────────────────────────────
fetchStatus().then(() => log("Connected to Supabase ✓", "info"));
setInterval(() => { if (!isBusy) fetchStatus(); }, 10000);
</script>
</body>
</html>
